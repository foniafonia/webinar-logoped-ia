<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Visualizador S / Z en vivo</title>
<style>
  :root{
    --bg:#0f172a;
    --panel:#111827;
    --line:#94a3b8;
    --live:#22c55e;
    --accent:#38bdf8;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --warn:#fbbf24;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap{
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
  }
  h1{
    font-size: 1.25rem;
    margin: 0 0 12px;
  }
  .controls{
    display:flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
  }
  button{
    background: var(--accent);
    color:#0b1220;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
  }
  button:disabled{
    opacity:.5;
    cursor:not-allowed;
  }
  .status{
    font-size:.9rem;
    color: var(--muted);
  }
  .notice{
    background: rgba(251,191,36,0.12);
    border: 1px solid rgba(251,191,36,0.4);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: .9rem;
    margin-bottom: 12px;
  }
  .panels{
    display:grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  @media (min-width: 720px){
    .panels{ grid-template-columns: 1fr 1fr; }
  }
  .panel{
    background: var(--panel);
    border-radius: 16px;
    padding: 12px;
  }
  .panel h2{
    margin:0 0 8px;
    font-size:1rem;
    color: var(--muted);
    font-weight:600;
  }
  canvas{
    width: 100%;
    height: 220px;
    display:block;
    border-radius: 12px;
    background: #0b1220;
  }
  .note{
    margin-top: 10px;
    font-size: .85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Visualización en vivo (S / Z)</h1>

    <div id="notice" class="notice" style="display:none;"></div>

    <div class="controls">
      <button id="btnStart">Iniciar micrófono</button>
      <button id="btnStop" disabled>Detener</button>
      <button id="btnDemo">Modo demo</button>
      <button id="btnCapture" disabled>Capturar y copiar</button>
      <span class="status" id="status">Micrófono inactivo</span>
    </div>

    <div class="panels">
      <div class="panel">
        <h2>Referencia S + Onda en vivo</h2>
        <canvas id="canvasS"></canvas>
      </div>
      <div class="panel">
        <h2>Referencia Z + Onda en vivo</h2>
        <canvas id="canvasZ"></canvas>
      </div>
    </div>

    <div class="note">
      Consejo: habla o vocaliza cerca del micrófono para ver una onda más clara.
    </div>
  </div>

<script>
(() => {
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const btnDemo = document.getElementById('btnDemo');
  const btnCapture = document.getElementById('btnCapture');
  const statusEl = document.getElementById('status');
  const noticeEl = document.getElementById('notice');

  const canvasS = document.getElementById('canvasS');
  const canvasZ = document.getElementById('canvasZ');
  const ctxS = canvasS.getContext('2d');
  const ctxZ = canvasZ.getContext('2d');

  let audioCtx, analyser, dataArray, source, stream;
  let running = false;
  let rafId = null;
  let demoMode = false;
  let demoPhase = 0;

  const inIframe = (() => {
    try { return window.self !== window.top; } catch { return true; }
  })();

  function showNotice(msg){
    noticeEl.textContent = msg;
    noticeEl.style.display = 'block';
  }

  if (inIframe){
    showNotice('Estás en un iframe (como Poe). El micrófono suele estar bloqueado aquí. Usa "Modo demo" o abre este HTML en http://localhost o HTTPS.');
  }

  function resizeCanvas(c) {
    const rect = c.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    c.width = Math.floor(rect.width * dpr);
    c.height = Math.floor(rect.height * dpr);
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function resizeAll(){
    resizeCanvas(canvasS);
    resizeCanvas(canvasZ);
    drawStatic();
  }

  window.addEventListener('resize', resizeAll);

  function drawGrid(ctx, w, h){
    ctx.save();
    ctx.strokeStyle = 'rgba(148,163,184,0.08)';
    ctx.lineWidth = 1;
    const step = 20;
    for(let x=0;x<w;x+=step){
      ctx.beginPath();
      ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
    }
    for(let y=0;y<h;y+=step){
      ctx.beginPath();
      ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawReferenceS(ctx, w, h){
    ctx.save();
    ctx.strokeStyle = 'rgba(148,163,184,0.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const midY = h/2;
    const amp = h*0.30;
    const left = w*0.08;
    const right = w*0.92;

    ctx.moveTo(left, midY + amp);
    ctx.bezierCurveTo(
      w*0.20, midY + amp,
      w*0.20, midY - amp,
      w*0.40, midY - amp
    );
    ctx.bezierCurveTo(
      w*0.60, midY - amp,
      w*0.60, midY + amp,
      w*0.80, midY + amp
    );
    ctx.bezierCurveTo(
      w*0.90, midY + amp,
      w*0.90, midY - amp,
      right, midY - amp
    );
    ctx.stroke();
    ctx.restore();
  }

  function drawReferenceZ(ctx, w, h){
    ctx.save();
    ctx.strokeStyle = 'rgba(148,163,184,0.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const top = h*0.25;
    const bottom = h*0.75;
    const left = w*0.08;
    const right = w*0.92;

    ctx.moveTo(left, top);
    ctx.lineTo(right, top);
    ctx.lineTo(left, bottom);
    ctx.lineTo(right, bottom);
    ctx.stroke();
    ctx.restore();
  }

  function drawLiveWave(ctx, w, h, arr){
    ctx.save();
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 2;
    ctx.beginPath();

    const slice = w / arr.length;
    let x = 0;
    for (let i = 0; i < arr.length; i++){
      const v = arr[i] / 128.0; // 0..2
      const y = (v * h/2);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
      x += slice;
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawStatic(){
    const wS = canvasS.clientWidth;
    const hS = canvasS.clientHeight;
    const wZ = canvasZ.clientWidth;
    const hZ = canvasZ.clientHeight;

    ctxS.clearRect(0,0,wS,hS);
    ctxZ.clearRect(0,0,wZ,hZ);

    drawGrid(ctxS, wS, hS);
    drawGrid(ctxZ, wZ, hZ);

    drawReferenceS(ctxS, wS, hS);
    drawReferenceZ(ctxZ, wZ, hZ);
  }

  function render(){
    const wS = canvasS.clientWidth;
    const hS = canvasS.clientHeight;
    const wZ = canvasZ.clientWidth;
    const hZ = canvasZ.clientHeight;

    ctxS.clearRect(0,0,wS,hS);
    ctxZ.clearRect(0,0,wZ,hZ);

    drawGrid(ctxS, wS, hS);
    drawGrid(ctxZ, wZ, hZ);

    drawReferenceS(ctxS, wS, hS);
    drawReferenceZ(ctxZ, wZ, hZ);

    if (demoMode){
      const len = 2048;
      const demo = new Uint8Array(len);
      for(let i=0;i<len;i++){
        const t = (i/len) * Math.PI * 2;
        const s = Math.sin(t*2 + demoPhase) * 0.6 + Math.sin(t*6 + demoPhase*1.3)*0.2;
        const v = (s * 0.8 + 1) * 128;
        demo[i] = Math.max(0, Math.min(255, v));
      }
      demoPhase += 0.06;
      drawLiveWave(ctxS, wS, hS, demo);
      drawLiveWave(ctxZ, wZ, hZ, demo);
    } else if (analyser && dataArray){
      analyser.getByteTimeDomainData(dataArray);
      drawLiveWave(ctxS, wS, hS, dataArray);
      drawLiveWave(ctxZ, wZ, hZ, dataArray);
    }

    rafId = requestAnimationFrame(render);
  }

  async function startMic(){
    demoMode = false;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      const bufferLength = analyser.fftSize;
      dataArray = new Uint8Array(bufferLength);

      source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);

      running = true;
      statusEl.textContent = 'Micrófono activo';
      btnStart.disabled = true;
      btnStop.disabled = false;
      btnCapture.disabled = false;

      render();
    } catch(err){
      statusEl.textContent = 'No se pudo acceder al micrófono.';
      showNotice('El micrófono está bloqueado en este entorno. Abre este HTML en http://localhost o HTTPS para activarlo. En Poe solo funciona el modo demo.');
      console.error(err);
    }
  }

  function stopMic(){
    running = false;
    demoMode = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (source) source.disconnect();
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();

    btnStart.disabled = false;
    btnStop.disabled = true;
    btnCapture.disabled = false;
    statusEl.textContent = 'Micrófono detenido';
    drawStatic();
  }

  function startDemo(){
    if (rafId) cancelAnimationFrame(rafId);
    demoMode = true;
    btnStart.disabled = false;
    btnStop.disabled = true;
    btnCapture.disabled = false;
    statusEl.textContent = 'Modo demo (sin micrófono)';
    render();
  }

  async function captureAndCopy(){
    const w = canvasS.width / (window.devicePixelRatio || 1);
    const h = canvasS.height / (window.devicePixelRatio || 1);
    const gap = 16;

    const out = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 1;
    out.width = Math.floor((w*2 + gap) * dpr);
    out.height = Math.floor(h * dpr);
    const octx = out.getContext('2d');
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);

    octx.fillStyle = '#0b1220';
    octx.fillRect(0,0,w*2 + gap,h);

    octx.fillStyle = '#e2e8f0';
    octx.font = '16px system-ui, sans-serif';
    octx.fillText('S', 8, 20);
    octx.fillText('Z', w + gap + 8, 20);

    octx.drawImage(canvasS, 0, 0, w, h);
    octx.drawImage(canvasZ, w + gap, 0, w, h);

    out.toBlob(async (blob) => {
      if (!blob) return;

      if (navigator.clipboard && window.ClipboardItem) {
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          statusEl.textContent = 'Imagen copiada al portapapeles.';
          return;
        } catch (e) {
          console.warn(e);
        }
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'captura-onda.png';
      a.click();
      URL.revokeObjectURL(url);
      statusEl.textContent = 'Portapapeles no disponible. Imagen descargada.';
    }, 'image/png');
  }

  btnStart.addEventListener('click', startMic);
  btnStop.addEventListener('click', stopMic);
  btnDemo.addEventListener('click', startDemo);
  btnCapture.addEventListener('click', captureAndCopy);

  resizeAll();
})();
</script>
</body>
</html>
